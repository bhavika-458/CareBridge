spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=read_only

management.endpoints.web.exposure.include=gateway,health,info

spring.cloud.gateway.server.webflux.routes[0].id=protected-test-local
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/protected/**